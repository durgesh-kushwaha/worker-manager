<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Worker Manager - Kanhaiya Kushwaha</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav-bar">
    <h1>Kanhaiya Kushwaha</h1>
    <div class="nav-bar-info">Durgesh Kushwaha: durgeshcgc@gmail.com</div>
  </nav>

  <div class="container">
    <section class="card sidebar">
      <div class="form-section">
        <h2>Company Logo</h2>
        <input id="logo-input" type="file" accept="image/*" class="input-field file-input" />
        <button id="clear-logo" class="btn btn-danger-500 mt-3">Remove Logo</button>
      </div>

      <div class="form-section">
        <h2>Add / Update Worker</h2>
        <div class="input-stack">
          <input id="worker-id" placeholder="Worker ID" class="input-field" />
          <input id="worker-name" placeholder="Full Name" class="input-field" />
          <input id="worker-position" placeholder="Position" class="input-field" />
          <input id="worker-hours" placeholder="Work Hours" type="number" class="input-field" />
          <div class="input-group">
            <button id="add-worker" class="btn btn-primary btn-flex">Save Worker</button>
            <button id="delete-worker" class="btn btn-danger-600 btn-flex">Delete</button>
          </div>
          <button id="clear-form" class="btn btn-secondary">Clear</button>
        </div>
      </div>

      <div class="form-section">
        <h2>Select Worker</h2>
        <select id="workers-dropdown" class="input-field">
          <option value="">-- Select a worker to add to list --</option>
        </select>
        <div class="input-group mt-3">
          <button id="add-selected" class="btn btn-success btn-flex">Add to List</button>
          <button id="clear-list" class="btn btn-gray-400 btn-flex">Clear List</button>
        </div>
        <button id="add-all-workers" class="btn btn-indigo mt-3">Add All Workers to List</button>
      </div>

      <div class="form-section">
        <h2>Bulk Edit Hours</h2>
        <div class="input-stack">
          <input id="bulk-hours-input" type="number" placeholder="Set hours (e.g. 8)" class="input-field" />
          <div class="checkbox-group">
            <input id="bulk-only-selected" type="checkbox" />
            <label for="bulk-only-selected">Apply only to today's list (unchecked = all workers)</label>
          </div>
          <div class="input-group">
            <button id="apply-bulk-hours" class="btn btn-warning btn-flex">Apply Hours</button>
            <button id="increment-bulk-hours" class="btn btn-emerald btn-flex">Add +1 Hour</button>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>CSV Backup</h2>
        <div class="input-stack">
          <button id="export-csv" class="btn btn-indigo">Export CSV</button>
          <input id="import-csv" type="file" accept=".csv,text/csv,text/plain,*/*" class="input-field file-input" />
        </div>
      </div>

      <div class="status-bar" id="status">Ready</div>
    </section>

    <section class="main-content">
      <div id="export-area" class="card card-p6">
        <div id="logo-area"></div>

        <div class="date-controls">
          <label>Date:</label>
          <input id="export-date-input" class="input-field" type="date" style="width: auto;" />
        </div>

        <p id="export-date-display"></p>

        <h2 id="export-title">Workers Overtime Sheet - Mechanical Yard</h2>

        <div id="selected-list-container" class="table-wrapper">
          <table id="selected-table" class="data-table">
            <thead class="table-header">
              <tr>
                <th>PID</th>
                <th>Name</th>
                <th>Hours</th>
                <th>Position</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="export-buttons-group">
        <button id="export-pdf" class="btn-emerald">Export PDF</button>
        <button id="export-image" class="btn-warning">Export Image</button>
        <button id="download-json" class="btn-gray-700">Backup JSON</button>
        <button id="clear-storage" class="btn-danger-500">Clear All Data</button>
      </div>
    </section>
  </div>

  <script src="script.js" defer></script>

  <footer class="app-footer">
    Made with ❤️ by Durgesh Kushwaha - <a href="mailto:durgeshcgc@gmail.com">durgeshcgc@gmail.com</a>
  </footer>
</body>
</html>
