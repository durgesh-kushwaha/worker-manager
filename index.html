<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workers Manager</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @media (max-width: 640px) {
      #selected-table .action-group {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
      }

      #selected-table .action-group button {
        width: 100% !important;
        margin-left: 0 !important;
      }
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <nav class="w-full bg-white shadow-sm py-3 px-6 flex justify-between items-center">
    <h1 class="text-xl font-semibold">Kanhaiya Kushwaha</h1>
    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm shadow hover:bg-blue-700">
      Export PDF
    </button>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <section class="glass p-5 rounded-xl shadow">

      <div class="mb-6">
        <h2 class="text-lg font-semibold mb-3">Company Logo</h2>
        <input id="logo-input" type="file" accept="image/*" class="w-full text-sm bg-gray-100 p-2 rounded border" />
        <button id="clear-logo" class="mt-3 w-full bg-red-500 text-white py-2 rounded-lg text-sm">
          Remove Logo
        </button>
      </div>

      <hr class="my-5">

      <div>
        <h2 class="text-lg font-semibold mb-3">Add / Update Worker</h2>

        <div class="space-y-3">
          <input id="worker-id" placeholder="Worker PID" class="w-full p-3 rounded border bg-gray-50" />
          <input id="worker-name" placeholder="Full Name" class="w-full p-3 rounded border bg-gray-50" />
          <input id="worker-position" placeholder="Position" class="w-full p-3 rounded border bg-gray-50" />
          <input id="worker-hours" placeholder="Work Hours" type="number"
            class="w-full p-3 rounded border bg-gray-50" />

          <div class="flex flex-col sm:flex-row gap-3">
            <button id="add-worker" class="w-full bg-blue-600 text-white py-2 rounded-lg">Save Worker</button>
            <button id="delete-worker" class="w-full bg-red-600 text-white py-2 rounded-lg">Delete</button>
          </div>
          <button id="clear-form" class="w-full bg-gray-300 py-2 rounded-lg">Clear</button>
        </div>
      </div>

      <hr class="my-6">

      <div>
        <h2 class="text-lg font-semibold mb-3">Select Worker</h2>
        <select id="workers-dropdown" class="w-full p-3 rounded border bg-gray-50">
          <option value="">Choose worker...</option>
        </select>
        <button id="add-selected" class="mt-3 w-full bg-green-600 text-white py-2 rounded-lg">Add to Today</button>
        <button id="clear-list" class="mt-2 w-full bg-gray-400 text-white py-2 rounded-lg">Clear Today List</button>
        <button id="add-all-workers" class="mt-3 w-full bg-indigo-600 text-white py-2 rounded-lg">
          Add All Workers to List
        </button>

      </div>

      <hr class="my-6">

      <div>
        <h2 class="text-lg font-semibold mb-3">CSV Backup</h2>

        <div class="flex flex-col gap-3">
          <button id="export-csv" class="w-full bg-indigo-600 text-white py-2 rounded-lg">Export CSV</button>
          <input id="import-csv" type="file" accept=".csv,text/csv,text/plain,*/*" class="bg-gray-100 w-full p-2 rounded border" />
        </div>
      </div>

      <p id="status" class="text-xs mt-4 text-gray-600"></p>
    </section>

    <section class="lg:col-span-2">

      <div class="bg-white rounded-xl shadow p-6" id="export-area">

        <div id="logo-area" class="flex justify-center items-center min-h-[80px] mb-4 rounded-lg bg-gray-50"></div>

        <div class="flex justify-center items-center gap-3 mb-4">
          <label class="font-medium">Date:</label>
          <input id="export-date-input" class="p-2 border rounded bg-gray-50" type="date" />
        </div>

        <p id="export-date-display" class="text-center mb-6 text-sm text-gray-500"></p>

        <h2 class="text-2xl font-bold text-center mb-5">Today's Workers Overtime Sheet</h2>

        <div id="selected-list-container" class="overflow-auto max-h-[420px] rounded-lg border">
          <table id="selected-table" class="w-full text-sm">
            <thead class="bg-gray-100 sticky top-0 z-10">
              <tr>
                <th class="p-3 border text-left">PID</th>
                <th class="p-3 border text-left">Worker</th>
                <th class="p-3 border text-left">Position</th>
                <th class="p-3 border text-left">Hours</th>
                <th class="p-3 border text-left">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <button id="export-pdf" class="bg-green-700 text-white px-4 py-2 rounded-lg shadow">Export PDF</button>
        <button id="export-image" class="bg-yellow-600 text-white px-4 py-2 rounded-lg shadow">Export Image</button>
        <button id="download-json" class="bg-gray-700 text-white px-4 py-2 rounded-lg shadow">Backup JSON</button>
        <button id="clear-storage" class="bg-red-500 text-white px-4 py-2 rounded-lg shadow">Clear All Data</button>
      </div>

    </section>

  </div>
  <script src="script.js" defer></script>

</body>

<footer class="w-full text-center py-4 mt-1 text-gray-500 text-sm border-t">
  Made with ❤️ by Durgesh Kushwaha
</footer>



</html>
